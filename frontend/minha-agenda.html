  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="busca-cuidadores.html" class="nav-link">Buscar cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="historico.html" class="nav-link">Histórico</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="mensagens.html" class="nav-link">Chat</a>
        <a href="meu-perfil.html" class="nav-link">Editar perfil</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Agenda</span>
        <h1>Minha agenda de tarefas</h1>
      </div>
    </section>

    <section class="card" style="padding:16px; margin-bottom:20px;">
      <form id="form-filtros" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
        <label>De <input type="date" id="filtro-inicio"></label>
        <label>Até <input type="date" id="filtro-fim"></label>
        <label>Status
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="concluida">Concluída</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <button type="button" class="btn btn-ghost" id="btn-limpar">Limpar</button>
      </form>
    </section>

    <section class="card">
      <table class="table">
        <thead>
          <tr><th>Data</th><th>Hora</th><th>Tarefa</th><th>Ocasião</th><th>Auxiliado</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="agenda-corpo">
          <tr><td colspan="7" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/minha-agenda.js"></script>
</body>
</html>
