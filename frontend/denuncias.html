<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Denúncias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="mensagens.html" class="nav-link">Chat</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Denúncias</span>
        <h1>Denúncias registradas</h1>
      </div>
      <button class="btn btn-primary" id="btn-nova-denuncia">+ Nova denúncia</button>
    </section>

    <p class="hint">Informe os IDs de usuário do denunciante e do denunciado.</p>

    <section class="card">
      <table class="table" id="tabela-denuncias">
        <thead>
          <tr><th>ID</th><th>Denunciante</th><th>Denunciado</th><th>Tipo denunciante</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="denuncias-corpo">
          <tr><td colspan="6" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <div class="modal-backdrop" id="modal-denuncia">
      <form class="modal" id="form-denuncia">
        <h2 id="modal-denuncia-titulo">Nova denúncia</h2>
        <input type="hidden" id="denuncia-id">
        <label>ID do denunciante <input type="number" id="denuncia-id-denunciante" required></label>
        <label>ID do denunciado <input type="number" id="denuncia-id-denunciado" required></label>
        <label>Tipo do denunciante
          <select id="denuncia-tipo-denunciante">
            <option value="cliente">Cliente</option>
            <option value="cuidador">Cuidador</option>
          </select>
        </label>
        <label>Descrição <textarea id="denuncia-descricao" rows="3" required></textarea></label>
        <label>Status
          <select id="denuncia-status">
            <option value="pendente">Pendente</option>
            <option value="em análise">Em análise</option>
            <option value="resolvida">Resolvida</option>
            <option value="arquivada">Arquivada</option>
          </select>
        </label>
        <label>Penalidade <input type="text" id="denuncia-penalidade" placeholder="Nenhuma"></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-denuncia">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/denuncias.js"></script>
   
</body>
</html>
