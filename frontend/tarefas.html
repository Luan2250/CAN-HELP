<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CanHelp · Tarefas</title>

    <!-- FONTES -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
      <link rel="icon" type="image/png" href="../img/canhelplogo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS GERAL -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- CSS TAREFAS -->
    <link
        rel="stylesheet"
        href="css/tarefas.css"
    >

</head>

<body>

    <!-- =====================================================
         MENU
    ====================================================== -->

    <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="page tarefas-page">


        <!-- CABEÇALHO -->

        <section class="tarefas-hero">

            <div>

                <span class="eyebrow">
                    TAREFAS
                </span>

                <h1>
                    Minhas tarefas
                </h1>

            </div>

            <button
                class="btn-nova-tarefa"
                id="btn-nova-tarefa"
                type="button"
            >
                + Nova tarefa
            </button>

        </section>


        <!-- FILTROS -->

        <section class="tarefas-filtro">

            <button
                type="button"
                class="filtro-tarefa ativo"
                id="filtro-todas"
            >
                Todas
            </button>

            <button
                type="button"
                class="filtro-tarefa"
                id="filtro-pendentes"
            >
                Pendentes
            </button>

            <button
                type="button"
                class="filtro-tarefa"
                id="filtro-concluidas"
            >
                Concluídas
            </button>

        </section>


        <!-- LISTA -->

        <section
            id="tarefas-corpo"
            class="tarefas-lista"
        >

            <div class="tarefas-loading">
                Carregando...
            </div>

        </section>

    </main>


    <!-- =====================================================
         MODAL
    ====================================================== -->

    <div
        class="modal-backdrop"
        id="modal-tarefa"
    >

        <form
            class="modal cadastro-modal"
            id="form-tarefa"
        >

            <!-- TOPO AZUL -->

            <div class="cadastro-header">

                <div class="cadastro-icon">
                    CH
                </div>

                <h2 id="modal-tarefa-titulo">
                    Nova tarefa
                </h2>

                <p>
                    Preencha os dados da tarefa.
                </p>

            </div>


            <!-- CORPO -->

            <div class="cadastro-conteudo">

                <input
                    type="hidden"
                    id="tarefa-id"
                >


                <!-- ID DA AGENDA -->

                <label>

                    Compromisso da agenda

                    <select id="tarefa-id-agenda" required></select>

                </label>


                <!-- DESCRIÇÃO -->

                <label>

                    Descrição

                    <textarea
                        id="tarefa-descricao"
                        rows="4"
                        maxlength="500"
                        placeholder="Digite o que precisa ser feito"
                        required
                    ></textarea>

                </label>


                <!-- HORA -->

                <label>

                    Hora

                    <input
                        type="time"
                        id="tarefa-hora"
                        required
                    >

                </label>


                <!-- STATUS -->

                <label>

                    Status

                    <select id="tarefa-status">

                        <option value="pendente">
                            Pendente
                        </option>

                        <option value="concluida">
                            Concluída
                        </option>

                    </select>

                </label>


                <!-- NOTIFICAÇÃO -->

                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="tarefa-notificacao"
                        checked
                    >

                    <span>
                        Receber notificação
                    </span>

                </label>


                <!-- BOTÕES -->

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn btn-ghost"
                        id="btn-cancelar-tarefa"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Salvar tarefa
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/seletores.js"></script>

    <script src="js/tarefas.js"></script>

</body>

</html>
