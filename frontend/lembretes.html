<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Lembretes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="busca-cuidadores.html" class="nav-link">Buscar cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="historico.html" class="nav-link">Histórico</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="mensagens.html" class="nav-link">Chat</a>
        <a href="meu-perfil.html" class="nav-link">Editar perfil</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Lembretes</span>
        <h1>Meus lembretes</h1>
      </div>
      <button class="btn btn-primary" id="btn-novo-lembrete">+ Novo lembrete</button>
    </section>

    <section class="card">
      <table class="table">
        <thead><tr><th>Data</th><th>Hora</th><th>Título</th><th>Descrição</th></tr></thead>
        <tbody id="lembretes-corpo">
          <tr><td colspan="4" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <div class="modal-backdrop" id="modal-lembrete">
      <form class="modal" id="form-lembrete">
        <h2>Novo lembrete</h2>
        <label>Título <input type="text" id="lembrete-titulo" maxlength="100" required></label>
        <label>Descrição <textarea id="lembrete-descricao" rows="3" maxlength="255"></textarea></label>
        <label>Data <input type="date" id="lembrete-data" required></label>
        <label>Hora <input type="time" id="lembrete-hora" required></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-lembrete">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/lembretes.js"></script>
</body>
</html>
