<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Esse cabeçalho/menu é IDÊNTICO em todas as páginas. Como não temos mais
       Jinja (sem {% extends %}), ele precisa ser copiado e colado no topo de
       cada .html. É repetitivo, mas é assim que HTML puro funciona. -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Usuários</span>
        <h1>Usuários cadastrados</h1>
      </div>
      <button class="btn btn-primary" id="btn-novo-usuario">+ Novo usuário</button>
    </section>

    <section class="card">
      <table class="table" id="tabela-usuarios">
        <thead>
          <tr>
            <th>ID</th><th>CPF</th><th>Email</th><th>Telefone</th><th>Endereço</th><th>Nascimento</th><th></th>
          </tr>
        </thead>
        <tbody id="usuarios-corpo">
          <tr><td colspan="7" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Modal de criar/editar. Fica escondido (display:none via CSS) até
         alguém chamar abrirModal('modal-usuario') no JS. -->
    <div class="modal-backdrop" id="modal-usuario">
      <form class="modal" id="form-usuario">
        <h2 id="modal-usuario-titulo">Novo usuário</h2>
        <input type="hidden" id="usuario-id">
        <label>CPF <input type="text" id="usuario-cpf" maxlength="11" placeholder="Somente números" required></label>
        <label>Email <input type="email" id="usuario-email" required></label>
        <label>Telefone <input type="text" id="usuario-telefone" required></label>
        <label>Endereço <input type="text" id="usuario-endereco"></label>
        <label>Data de nascimento <input type="date" id="usuario-data-nascimento" required></label>
        <label>Senha <input type="password" id="usuario-senha" placeholder="Deixe em branco para não alterar"></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-usuario">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
  
</body>
</html>
