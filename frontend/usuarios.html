<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CanHelp · Usuários</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
    <link rel="icon" type="image/png" href="../img/canhelplogo.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/usuarios.css">
</head>

<body>

  <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>


  <main class="page usuarios-page">

    <section class="page-head">

      <div>

        <span class="eyebrow">
          USUÁRIOS
        </span>

        <h1>
          Usuários cadastrados
        </h1>

      </div>

      <button class="btn btn-primary" id="btn-novo-usuario" type="button">
        + Novo usuário
      </button>

    </section>

    <section class="card">

      <table class="table" id="tabela-usuarios">

        <thead>

          <tr>
            <th>ID</th>
            <th>CPF</th>
            <th>EMAIL</th>
            <th>TELEFONE</th>
            <th>ENDEREÇO</th>
            <th>NASCIMENTO</th>
            <th></th>
          </tr>

        </thead>

        <tbody id="usuarios-corpo">

          <tr>
            <td colspan="7" class="empty">
              Carregando...
            </td>
          </tr>

        </tbody>

      </table>

    </section>


    <div class="modal-backdrop" id="modal-usuario">

      <form class="modal cadastro-modal" id="form-usuario">

        <div class="cadastro-header">

          <div class="cadastro-icon">
            CH
          </div>

          <h2 id="modal-usuario-titulo">
            Novo usuário
          </h2>

          <p>
            Preencha os dados para cadastrar um usuário.
          </p>

        </div>


        <div class="cadastro-conteudo">

          <input type="hidden" id="usuario-id">


          <label>
            CPF

            <input type="text" id="usuario-cpf" placeholder="Digite o CPF" required>

          </label>


          <label>
            E-mail

            <input type="email" id="usuario-email" placeholder="Digite o e-mail" required>

          </label>


          <label>
            Telefone

            <input type="text" id="usuario-telefone" placeholder="Digite o telefone" required>

          </label>


          <label>
            Endereço

            <input type="text" id="usuario-endereco" placeholder="Digite o endereço" required>

          </label>


          <label>
            Data de nascimento

            <input type="date" id="usuario-nascimento" required>

          </label>


          <div class="modal-actions">

            <button type="button" class="btn btn-ghost" id="btn-cancelar-usuario">
              Cancelar
            </button>

            <button type="submit" class="btn btn-primary">
              Salvar usuário
            </button>

          </div>

        </div>

      </form>

    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
