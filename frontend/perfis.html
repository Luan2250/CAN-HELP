<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CanHelp · Perfis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/perfil.css">
    <link rel="icon" type="image/png" href="../img/canhelplogo.png">

</head>

<body>

  <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>


  <main class="page perfis-page">

    <section class="page-head">

      <div>

        <span class="eyebrow">
          Perfis
        </span>

        <h1>
          Perfis cadastrados
        </h1>

      </div>

      <button class="btn btn-primary" id="btn-novo-perfil" type="button">

        + Novo perfil

      </button>

    </section>


    <section class="card">

      <table class="table" id="tabela-perfis">

        <thead>

          <tr>

            <th>ID Usuário</th>

            <th>Nome</th>

            <th>Cidade</th>

            <th>Estado</th>

            <th>Bio</th>

            <th></th>

          </tr>

        </thead>

        <tbody id="perfis-corpo">

          <tr>

            <td colspan="6" class="empty">

              Carregando...

            </td>

          </tr>

        </tbody>

      </table>

    </section>




    <div class="modal-backdrop" id="modal-perfil">

      <form class="modal cadastro-modal" id="form-perfil">




        <div class="cadastro-header">

          <div class="cadastro-icon">
            CH
          </div>

          <h2 id="modal-perfil-titulo">
            Novo perfil
          </h2>

          <p>
            Preencha os dados para criar seu perfil.
          </p>

        </div>




        <div class="cadastro-conteudo">

          <input type="hidden" id="perfil-id-original">



          <div id="bloco-dados-usuario">

            <label>

              Nome completo

              <input type="text" id="perfil-nome" placeholder="Digite seu nome completo" required>

            </label>


            <label>

              Email

              <input type="email" id="perfil-email" placeholder="Digite seu email" required>

            </label>


            <label>

              CPF

              <input type="text" id="perfil-cpf" maxlength="11" placeholder="Somente números" required>

            </label>


            <label>

              Telefone

              <input type="text" id="perfil-telefone" placeholder="Digite seu telefone" required>

            </label>


            <label>

              Endereço

              <input type="text" id="perfil-endereco" placeholder="Digite seu endereço">

            </label>


            <label>

              Data de nascimento

              <input type="date" id="perfil-data-nascimento" required>

            </label>


            <label>

              Senha

              <input type="password" id="perfil-senha" placeholder="Digite sua senha" required>

            </label>


            <label>

              Confirmar senha

              <input type="password" id="perfil-confirmar-senha" placeholder="Confirme sua senha" required>

            </label>

          </div>



          <div id="bloco-tipo">

            <label class="tipo-label">
              Você é
            </label>


            <div class="tipos-perfil">

              <button type="button" class="tipo ativo" id="perfil-cuidador">

                CUIDADOR

              </button>


              <button type="button" class="tipo" id="perfil-cliente">

                CLIENTE

              </button>

            </div>


            <select id="perfil-tipo" style="display: none;">

              <option value="">
                Selecione...
              </option>

              <option value="cliente">
                Cliente
              </option>

              <option value="cuidador">
                Cuidador
              </option>

            </select>



            <div id="campos-cuidador">

              <label>

                Certificado

                <input type="text" id="perfil-certificado" placeholder="Digite o certificado">

              </label>


              <label>

                Órgão emissor

                <input type="text" id="perfil-orgao" placeholder="Digite o órgão emissor">

              </label>


              <label>

                Valor do serviço

                <input type="number" step="0.01" min="0" id="perfil-valor" placeholder="R$ 0,00">

              </label>


              <label>

                Disponibilidade

                <input type="text" id="perfil-disponibilidade" placeholder="Ex: Segunda a sexta, manhã">

              </label>

            </div>

          </div>



          <label>
            Foto
          </label>


          <div class="file-upload">

            <input type="file" id="perfil-foto-arquivo" accept="image/*" hidden>


            <label for="perfil-foto-arquivo" class="btn btn-ghost file-upload-btn">

              Escolher foto

            </label>


            <img id="perfil-foto-preview" class="foto-preview" style="display: none;" alt="Pré-visualização">

          </div>


          <input type="hidden" id="perfil-foto-url">



          <label>

            Cidade

            <input type="text" id="perfil-cidade" placeholder="Digite sua cidade">

          </label>


          <label>

            Estado

            <input type="text" id="perfil-estado" maxlength="40" placeholder="Digite seu estado">

          </label>



          <label>

            Bio

            <textarea id="perfil-bio" rows="3" maxlength="220" placeholder="Conte um pouco sobre você..."></textarea>

          </label>




          <div class="modal-actions">

            <button type="button" class="btn btn-ghost" id="btn-cancelar-perfil">

              Cancelar

            </button>


            <button type="submit" class="btn btn-primary">

              Criar conta

            </button>

          </div>

        </div>

      </form>

    </div>

  </main>


  <div id="toast" class="toast">
  </div>


  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/perfis.js"></script>
