<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Perfis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Perfis</span>
        <h1>Perfis cadastrados</h1>
      </div>
      <button class="btn btn-primary" id="btn-novo-perfil">+ Novo perfil</button>
    </section>

    <section class="card">
      <table class="table" id="tabela-perfis">
        <thead>
          <tr><th>ID Usuário</th><th>Nome</th><th>Cidade</th><th>Estado</th><th>Bio</th><th></th></tr>
        </thead>
        <tbody id="perfis-corpo">
          <tr><td colspan="6" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <div class="modal-backdrop" id="modal-perfil">
      <form class="modal" id="form-perfil">
        <h2 id="modal-perfil-titulo">Novo perfil</h2>
        <input type="hidden" id="perfil-id-original">
        <label>ID do usuário <input type="number" id="perfil-id-usuario" required></label>
        <label>Nome <input type="text" id="perfil-nome" required></label>
        <label>URL da foto <input type="text" id="perfil-foto-url" placeholder="https://..."></label>
        <label>Cidade <input type="text" id="perfil-cidade"></label>
        <label>Estado <input type="text" id="perfil-estado" maxlength="40"></label>
        <label>Bio <textarea id="perfil-bio" rows="3" maxlength="220"></textarea></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-perfil">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/perfis.js"></script>
</body>
</html>
