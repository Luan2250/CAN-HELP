<!DOCTYPE html>
<html lang="pt-br">

<head>
      <link rel="icon" type="image/png" href="../img/canhelplogo.png">
      <link rel="icon" type="image/png" href="../img/canhelplogo.png">

    <meta charset="UTF-8">  

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CanHelp · Agenda</title>



    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >



    <link
        rel="stylesheet"
        href="css/style.css"
    >



    <link
        rel="stylesheet"
        href="css/agenda.css"
    >

</head>


<body>



    <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>





    <main class="page agenda-page">



        <section class="agenda-hero">

            <div>

                <span class="eyebrow">
                    AGENDA
                </span>

                <h1>
                    Minha agenda
                </h1>

            </div>


            <button
                type="button"
                class="btn-novo-compromisso"
                id="btn-novo-agenda"
            >
                + Novo compromisso
            </button>

        </section>




        <section class="agenda-filtro">

            <div class="agenda-filtro-topo">

                <span>
                    Filtrar por data
                </span>

                <input
                    type="date"
                    id="filtro-data"
                >

                <button
                    type="button"
                    class="btn-filtro"
                    id="btn-filtrar-data"
                >
                    Buscar
                </button>

                <button
                    type="button"
                    class="btn-filtro secundario"
                    id="btn-limpar-data"
                >
                    Todas
                </button>

            </div>

        </section>




        <section
            id="agenda-corpo"
            class="agenda-lista"
        >

            <div class="agenda-loading">
                Carregando...
            </div>

        </section>

    </main>




    <div
        class="modal-backdrop"
        id="modal-agenda"
    >

        <form
            class="modal cadastro-modal"
            id="form-agenda"
        >



            <div class="cadastro-header">

                <div class="cadastro-icon">
                    CH
                </div>

                <h2 id="modal-agenda-titulo">
                    Novo compromisso
                </h2>

                <p>
                    Preencha os dados para agendar um compromisso.
                </p>

            </div>




            <div class="cadastro-conteudo">

                <input
                    type="hidden"
                    id="agenda-id"
                >



                <label>

                    Contrato

                    <select id="agenda-id-contrato" required></select>

                </label>




                <div class="form-grid">

                    <label>

                        Data

                        <input
                            type="date"
                            id="agenda-data"
                            required
                        >

                    </label>


                    <label>

                        Hora

                        <input
                            type="time"
                            id="agenda-hora"
                            required
                        >

                    </label>

                </div>




                <label>

                    Ocasião

                    <input
                        type="text"
                        id="agenda-ocasiao"
                        maxlength="100"
                        placeholder="Ex: Consulta médica"
                        required
                    >

                </label>




                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        id="agenda-notificacao"
                        checked
                    >

                    <span>
                        Receber notificação
                    </span>

                </label>




                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn btn-ghost"
                        id="btn-cancelar-agenda"
                    >
                        Cancelar
                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Salvar compromisso
                    </button>

                </div>

            </div>

        </form>

    </div>




    <div
        id="toast"
        class="toast"
    ></div>




    <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/seletores.js"></script>

    <script src="js/agenda.js"></script>
