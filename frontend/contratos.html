<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Contratos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        

        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Contratos</span>
        <h1>Contratos cadastrados</h1>
      </div>
      <button class="btn btn-primary" id="btn-novo-contrato">+ Novo contrato</button>
    </section>

    <p class="hint">Informe o ID de um Cliente e de um Cuidador já cadastrados.</p>

    <section class="card">
      <table class="table" id="tabela-contratos">
        <thead>
          <tr><th>ID</th><th>Cliente</th><th>Cuidador</th><th>Atendimento</th><th>Status</th><th>Valor</th><th></th></tr>
        </thead>
        <tbody id="contratos-corpo">
          <tr><td colspan="7" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <div class="modal-backdrop" id="modal-contrato">
      <form class="modal" id="form-contrato">
        <h2 id="modal-contrato-titulo">Novo contrato</h2>
        <input type="hidden" id="contrato-id">
        <label>ID do cliente <input type="number" id="contrato-id-cliente" required></label>
        <label>ID do cuidador <input type="number" id="contrato-id-cuidador" required></label>
        <label>Data de atendimento <input type="date" id="contrato-data-atendimento" required></label>
        <label>Localização <input type="text" id="contrato-localizacao" required></label>
        <label>Nome do auxiliado <input type="text" id="contrato-nome-auxiliado" required></label>
        <label>Status
          <select id="contrato-status">
            <option value="pendente">Pendente</option>
            <option value="aceito">Aceito</option>
            <option value="recusado">Recusado</option>
            <option value="cancelado_cliente">Cancelado pelo cliente</option>
            <option value="cancelado_cuidador">Cancelado pelo cuidador</option>
            <option value="concluido">Concluído</option>
          </select>
        </label>
        <label>Valor final (R$) <input type="number" step="0.01" min="0" id="contrato-valor-final" required></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-contrato">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/contratos.js"></script>
   
</body>
</html>
