<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Avaliações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="usuarios.html" class="nav-link">Usuários</a>
        <a href="perfis.html" class="nav-link">Perfis</a>
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="cuidadores.html" class="nav-link">Cuidadores</a>
        <a href="contratos.html" class="nav-link">Contratos</a>
        <a href="agenda.html" class="nav-link">Agenda</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="avaliacoes.html" class="nav-link">Avaliações</a>
        <a href="denuncias.html" class="nav-link">Denúncias</a>
        <a href="lista-servicos.html" class="nav-link">Serviços</a>
        <a href="itens-contrato.html" class="nav-link">Itens do contrato</a>
        <a href="mensagens.html" class="nav-link">Chat</a>
        <a href="login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">Avaliações</span>
        <h1>Avaliações registradas</h1>
      </div>
      <button class="btn btn-primary" id="btn-nova-avaliacao">+ Nova avaliação</button>
    </section>

    <p class="hint">Informe os IDs de usuário do avaliador e do avaliado.</p>

    <section class="card">
      <table class="table" id="tabela-avaliacoes">
        <thead>
          <tr><th>ID</th><th>Avaliador</th><th>Avaliado</th><th>Tipo avaliador</th><th>Nota</th><th>Gorjeta</th><th></th></tr>
        </thead>
        <tbody id="avaliacoes-corpo">
          <tr><td colspan="7" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <div class="modal-backdrop" id="modal-avaliacao">
      <form class="modal" id="form-avaliacao">
        <h2 id="modal-avaliacao-titulo">Nova avaliação</h2>
        <input type="hidden" id="avaliacao-id">
        <label>ID do avaliador <input type="number" id="avaliacao-id-avaliador" required></label>
        <label>ID do avaliado <input type="number" id="avaliacao-id-avaliado" required></label>
        <label>Tipo do avaliador
          <select id="avaliacao-tipo-avaliador">
            <option value="cliente">Cliente</option>
            <option value="cuidador">Cuidador</option>
          </select>
        </label>
        <label>Nota (1 a 5) <input type="number" min="1" max="5" id="avaliacao-nota" required></label>
        <label>Comentário <textarea id="avaliacao-comentario" rows="2" maxlength="180"></textarea></label>
        <label>Gorjeta (R$) <input type="number" step="0.01" min="0" id="avaliacao-gorjeta" value="0"></label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancelar-avaliacao">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script> 
  <script src="js/avaliacoes.js"></script>
  
</body>
</html>
