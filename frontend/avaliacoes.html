<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CanHelp · Avaliações</title>


    <!-- FONTES -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
      <link rel="icon" type="image/png" href="../img/canhelplogo.png">


    <!-- CSS GERAL -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- CSS DA TELA -->

    <link
        rel="stylesheet"
        href="css/avaliacoes.css"
    >

</head>


<body>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="page avaliacoes-page">


        <section class="page-head">

            <div>

                <span class="eyebrow">
                    AVALIAÇÕES
                </span>

                <h1 id="titulo-avaliacoes">
                    Avaliações registradas
                </h1>

            </div>


            <button
                class="btn btn-primary"
                id="btn-nova-avaliacao"
                type="button"
            >
                + Nova avaliação
            </button>

        </section>



        <p class="hint" id="hint-avaliacoes">
            Informe os IDs de usuário do avaliador e do avaliado.
        </p>



        <!-- =================================================
             TABELA
        ================================================== -->

        <section class="card">

            <table
                class="table"
                id="tabela-avaliacoes"
            >

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Avaliador</th>

                        <th>Avaliado</th>

                        <th>Tipo</th>

                        <th>Nota</th>

                        <th>Comentário</th>

                        <th>Gorjeta</th>

                        <th></th>

                    </tr>

                </thead>


                <tbody id="avaliacoes-corpo">

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >
                            Carregando...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>



        <!-- =================================================
             MODAL
        ================================================== -->

        <div
            class="modal-backdrop"
            id="modal-avaliacao"
        >

            <form
                class="modal cadastro-modal"
                id="form-avaliacao"
            >


                <!-- TOPO AZUL -->

                <div class="cadastro-header">

                    <div class="cadastro-icon">
                        CH
                    </div>


                    <h2 id="modal-avaliacao-titulo">
                        Nova avaliação
                    </h2>


                    <p id="modal-avaliacao-descricao">
                        Preencha os dados para registrar uma avaliação.
                    </p>

                </div>



                <!-- CORPO -->

                <div class="cadastro-conteudo">

                    <input
                        type="hidden"
                        id="avaliacao-id"
                    >


                    <!-- AVALIADOR -->

                    <label>

                        ID do avaliador

                        <input
                            type="number"
                            id="avaliacao-id-avaliador"
                            placeholder="Digite o ID do avaliador"
                            required
                        >

                    </label>



                    <!-- AVALIADO -->

                    <label>

                        ID do avaliado

                        <input
                            type="number"
                            id="avaliacao-id-avaliado"
                            placeholder="Digite o ID do cuidador"
                            required
                        >

                    </label>



                    <!-- TIPO -->

                    <label>

                        Tipo do avaliador

                        <select
                            id="avaliacao-tipo-avaliador"
                        >

                            <option value="cliente">
                                Cliente
                            </option>

                            <option value="cuidador">
                                Cuidador
                            </option>

                        </select>

                    </label>



                    <!-- NOTA -->

                    <label>

                        Nota (1 a 5)

                        <input
                            type="number"
                            id="avaliacao-nota"
                            min="1"
                            max="5"
                            step="1"
                            placeholder="Digite uma nota de 1 a 5"
                            required
                        >

                    </label>



                    <!-- COMENTÁRIO -->

                    <label>

                        Comentário

                        <textarea
                            id="avaliacao-comentario"
                            rows="4"
                            maxlength="180"
                            placeholder="Digite um comentário..."
                        ></textarea>

                    </label>



                    <!-- GORJETA -->

                    <label>

                        Gorjeta (R$)

                        <input
                            type="number"
                            id="avaliacao-gorjeta"
                            step="0.01"
                            min="0"
                            value="0"
                            placeholder="0,00"
                        >

                    </label>



                    <!-- BOTÕES -->

                    <div class="modal-actions">

                        <button
                            type="button"
                            class="btn btn-ghost"
                            id="btn-cancelar-avaliacao"
                        >
                            Cancelar
                        </button>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Salvar avaliação
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>



    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>



    <!-- JAVASCRIPT -->

    <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

    <script src="js/avaliacoes.js"></script>
