<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanHelp · Histórico de serviços</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/historico.css">
    <link rel="icon" type="image/png" href="../img/canhelplogo.png">

</head>
<body>
  <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>

  <main class="page">
    <section class="page-head">
      <div>
        <span class="eyebrow">RF19 · Histórico</span>
        <h1>Histórico de serviços</h1>
      </div>
    </section>

    <section class="card historico-filtros-card">
      <form id="form-filtros" class="historico-filtros-form">
        <label>Status
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="aceito">Aceito (em andamento)</option>
            <option value="concluido">Concluído</option>
            <option value="recusado">Recusado</option>
            <option value="cancelado_cliente">Cancelado pelo cliente</option>
            <option value="cancelado_cuidador">Cancelado pelo cuidador</option>
          </select>
        </label>
        <label>Meu papel
          <select id="filtro-papel">
            <option value="">Todos</option>
            <option value="cliente">Como cliente</option>
            <option value="cuidador">Como cuidador</option>
          </select>
        </label>
        <button type="button" class="btn btn-ghost" id="btn-limpar">Limpar</button>
      </form>
    </section>

    <section class="card">
      <table class="table">
        <thead>
          <tr><th>Data do atendimento</th><th>Meu papel</th><th>Outra parte</th><th>Auxiliado</th><th>Serviços</th><th>Status</th><th>Valor</th><th></th></tr>
        </thead>
        <tbody id="historico-corpo">
          <tr><td colspan="8" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </section>


    <div class="modal-backdrop" id="modal-contrato">
      <div class="modal">
        <h2 id="ct-titulo">Contrato</h2>
        <p class="historico-detalhe-primeiro"><strong>Cliente:</strong> <span id="ct-cliente"></span></p>
        <p class="historico-detalhe"><strong>Cuidador:</strong> <span id="ct-cuidador"></span></p>
        <p class="historico-detalhe"><strong>Auxiliado:</strong> <span id="ct-auxiliado"></span></p>
        <p class="historico-detalhe"><strong>Local:</strong> <span id="ct-local"></span></p>
        <p class="historico-detalhe"><strong>Contratado em:</strong> <span id="ct-contratado"></span></p>
        <p class="historico-detalhe"><strong>Atendimento em:</strong> <span id="ct-atendimento"></span></p>
        <p class="historico-detalhe"><strong>Serviços:</strong> <span id="ct-servicos"></span></p>
        <p class="historico-detalhe"><strong>Status:</strong> <span id="ct-status"></span></p>
        <p class="historico-detalhe"><strong>Valor final:</strong> <span id="ct-valor"></span></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-fechar-contrato">Fechar</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/historico.js"></script>
<nav class="mobile-bottom-nav" aria-label="Navegação rápida no celular">

</nav>

</html>
