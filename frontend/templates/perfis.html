{% extends "base.html" %}
{% block title %}CanHelp · Perfis{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <span class="eyebrow">Perfis</span>
    <h1>Perfis cadastrados</h1>
  </div>
  <button class="btn btn-primary" id="btn-novo-perfil">+ Novo perfil</button>
</section>

<section class="card">
  <table class="table" id="tabela-perfis">
    <thead>
      <tr>
        <th>ID Usuário</th>
        <th>Nome</th>
        <th>Cidade</th>
        <th>Estado</th>
        <th>Bio</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="perfis-corpo">
      <tr><td colspan="6" class="empty">Carregando...</td></tr>
    </tbody>
  </table>
</section>

<div class="modal-backdrop" id="modal-perfil">
  <form class="modal" id="form-perfil">
    <h2 id="modal-perfil-titulo">Novo perfil</h2>
    <input type="hidden" id="perfil-id-original">

    <label>ID do usuário
      <input type="number" id="perfil-id-usuario" required>
    </label>
    <label>Nome
      <input type="text" id="perfil-nome" required>
    </label>
    <label>URL da foto
      <input type="text" id="perfil-foto-url" placeholder="https://...">
    </label>
    <label>Cidade
      <input type="text" id="perfil-cidade">
    </label>
    <label>Estado
      <input type="text" id="perfil-estado" maxlength="40">
    </label>
    <label>Bio
      <textarea id="perfil-bio" rows="3" maxlength="220"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btn-cancelar-perfil">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/perfis.js') }}"></script>
{% endblock %}
