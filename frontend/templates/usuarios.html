{% extends "base.html" %}
{% block title %}CanHelp · Usuários{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <span class="eyebrow">Usuários</span>
    <h1>Usuários cadastrados</h1>
  </div>
  <button class="btn btn-primary" id="btn-novo-usuario">+ Novo usuário</button>
</section>

<section class="card">
  <table class="table" id="tabela-usuarios">
    <thead>
      <tr>
        <th>ID</th>
        <th>CPF</th>
        <th>Email</th>
        <th>Telefone</th>
        <th>Endereço</th>
        <th>Nascimento</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="usuarios-corpo">
      <tr><td colspan="7" class="empty">Carregando...</td></tr>
    </tbody>
  </table>
</section>

<div class="modal-backdrop" id="modal-usuario">
  <form class="modal" id="form-usuario">
    <h2 id="modal-usuario-titulo">Novo usuário</h2>
    <input type="hidden" id="usuario-id">

    <label>CPF
      <input type="text" id="usuario-cpf" maxlength="11" placeholder="Somente números" required>
    </label>
    <label>Email
      <input type="email" id="usuario-email" required>
    </label>
    <label>Telefone
      <input type="text" id="usuario-telefone" required>
    </label>
    <label>Endereço
      <input type="text" id="usuario-endereco">
    </label>
    <label>Data de nascimento
      <input type="date" id="usuario-data-nascimento" required>
    </label>
    <label>Senha
      <input type="password" id="usuario-senha" placeholder="Deixe em branco para não alterar">
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btn-cancelar-usuario">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
{% endblock %}
