{% extends "base.html" %}
{% block title %}CanHelp · Cuidadores{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <span class="eyebrow">Cuidadores</span>
    <h1>Cuidadores cadastrados</h1>
  </div>
  <button class="btn btn-primary" id="btn-novo-cuidador">+ Novo cuidador</button>
</section>

<section class="card">
  <table class="table" id="tabela-cuidadores">
    <thead>
      <tr>
        <th>ID Usuário</th>
        <th>Certificado</th>
        <th>Órgão emissor</th>
        <th>Valor serviço</th>
        <th>Disponibilidade</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="cuidadores-corpo">
      <tr><td colspan="6" class="empty">Carregando...</td></tr>
    </tbody>
  </table>
</section>

<div class="modal-backdrop" id="modal-cuidador">
  <form class="modal" id="form-cuidador">
    <h2 id="modal-cuidador-titulo">Novo cuidador</h2>
    <input type="hidden" id="cuidador-id-original">

    <label>ID do usuário
      <input type="number" id="cuidador-id-usuario" required>
    </label>
    <label>Certificado
      <input type="text" id="cuidador-certificado" required>
    </label>
    <label>Órgão emissor
      <input type="text" id="cuidador-orgao-emissor" required>
    </label>
    <label>Valor do serviço (R$)
      <input type="number" step="0.01" min="0" id="cuidador-valor-servico" required>
    </label>
    <label>Disponibilidade
      <input type="text" id="cuidador-disponibilidade" placeholder="Ex: Segunda a sexta, manhã">
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btn-cancelar-cuidador">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cuidadores.js') }}"></script>
{% endblock %}
