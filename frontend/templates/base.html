<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CanHelp{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">CH</span>
        <span class="brand-name">CanHelp</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('tela_usuarios') }}" class="nav-link {% if active == 'usuarios' %}active{% endif %}">Usuários</a>
        <a href="{{ url_for('tela_perfis') }}" class="nav-link {% if active == 'perfis' %}active{% endif %}">Perfis</a>
        <a href="{{ url_for('tela_clientes') }}" class="nav-link {% if active == 'clientes' %}active{% endif %}">Clientes</a>
        <a href="{{ url_for('tela_cuidadores') }}" class="nav-link {% if active == 'cuidadores' %}active{% endif %}">Cuidadores</a>
        <a href="{{ url_for('tela_contratos') }}" class="nav-link {% if active == 'contratos' %}active{% endif %}">Contratos</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <div id="toast" class="toast"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
