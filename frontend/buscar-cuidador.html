<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CanHelp · Buscar cuidador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="icon" type="image/png" href="../img/canhelplogo.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/buscar-cuidador.css">

</head>

<body>


    <header class="topbar" id="site-header"></header>
  <script src="js/navbar.js"></script>



    <main class="page buscar-page">



        <section class="buscar-hero">

            <span class="eyebrow">
                CANHELP
            </span>

            <h1>
                Encontre um cuidador
            </h1>

            <p>
                Busque cuidadores e encontre o serviço ideal para você.
            </p>

        </section>



        <section class="buscar-area">
            <div class="search-box">
                <input type="text" id="campo-busca" placeholder="Buscar cuidador, cidade ou serviço" aria-label="Buscar cuidador, cidade ou serviço">
                <button type="button" id="btn-buscar" class="btn-search" aria-label="Buscar">🔎</button>
            </div>

            <div class="filtros-rapidos" aria-label="Atalhos de busca">
                <button type="button" class="filtro ativo" data-quick="nota">MELHOR AVALIAÇÃO</button>
                <button type="button" class="filtro" data-quick="disponibilidade">DISPONIBILIDADE</button>
                <button type="button" class="filtro" data-quick="valor_asc">MENOR PREÇO</button>
            </div>

            <details class="filtros-avancados" open>
                <summary>Filtrar cuidadores <span>Refine sua busca por localização, preço e disponibilidade</span></summary>
                <form id="form-filtros" class="filtros-form">
                    <label>Cidade
                        <input type="text" id="filtro-cidade" placeholder="Ex.: Recife">
                    </label>
                    <label>Estado
                        <input type="text" id="filtro-estado" maxlength="2" placeholder="Ex.: PE">
                    </label>
                    <label>Valor máximo (R$)
                        <input type="number" id="filtro-valor" min="0" step="0.01" placeholder="Ex.: 150">
                    </label>
                    <label>Nota mínima
                        <select id="filtro-nota">
                            <option value="">Qualquer</option>
                            <option value="3">3 ou mais</option>
                            <option value="4">4 ou mais</option>
                            <option value="4.5">4,5 ou mais</option>
                            <option value="5">5 estrelas</option>
                        </select>
                    </label>
                    <label>Disponível em
                        <input type="date" id="filtro-data">
                    </label>
                    <label>Ordenar por
                        <select id="filtro-ordenar">
                            <option value="">Padrão</option>
                            <option value="nota">Melhor avaliação</option>
                            <option value="valor_asc">Menor preço</option>
                            <option value="valor_desc">Maior preço</option>
                        </select>
                    </label>
                    <div class="filtros-acoes">
                        <button type="submit" class="btn-filtrar">Filtrar</button>
                        <button type="button" id="btn-limpar-filtros" class="btn-limpar">Limpar</button>
                    </div>
                </form>
            </details>
        </section>

        <section class="resultados" id="resultados-cuidadores" aria-live="polite">
            <div class="carregando">Carregando cuidadores...</div>
        </section>

    </main>



    <div id="toast" class="toast"></div>



    <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

    <script src="js/buscar-cuidador.js"></script>
